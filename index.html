const positions=new T.CatmullRomCurve3([new T.Vector3(-26,2.8,7),new T.Vector3(-13,3.8,6),new T.Vector3(10,8,25),new T.Vector3(15,15,36),new T.Vector3(0,15,40)],false,'centripetal'),targets=new T.CatmullRomCurve3([new T.Vector3(-17,2,-13),new T.Vector3(-4,3,-12),new T.Vector3(0,9,0),new T.Vector3(0,13.5,0),new T.Vector3(0,14,0)],false,'centripetal');let cinematic=true,elapsed=0,inspection='';const duration=24;function pose(u){const q=u*u*(3-2*u),p=positions.getPoint(q);p.z+=(Math.max(40,15/(Math.tan(T.MathUtils.degToRad(25))*camera.aspect))-40)*q;camera.position.copy(p);camera.lookAt(targets.getPoint(q))}function replay(){elapsed=0;inspection='';cinematic=true;controls.enabled=false;cta.classList.remove('show');document.getElementById('mode').textContent='Свободная камера'}function free(){cinematic=false;inspection='';controls.enabled=true;controls.target.set(0,14,0);controls.update();chapter.textContent='СВОБОДНЫЙ ОБЗОР';cta.classList.add('show');document.getElementById('mode').textContent='Финальный кадр'}document.getElementById('replay').onclick=replay;document.getElementById('mode').onclick=()=>{if(cinematic)free();else{inspection='';cinematic=true;elapsed=duration;controls.enabled=false;document.getElementById('mode').textContent='Свободная камера'}};document.getElementById('car').onclick=()=>{free();inspection='car';hero.position.set(-10,0,-5.5);camera.position.set(-3,3.3,.5);controls.target.set(-10,1,-5.5);controls.update();cta.classList.remove('show');chapter.textContent='АВТОМОБИЛЬ · МЯГКИЙ ФОКУС'};document.getElementById('drone').onclick=()=>{free();inspection='drone';drone.position.set(-7,5,2);camera.position.set(-3,6,7);controls.target.copy(drone.position);controls.update();cta.classList.remove('show');chapter.textContent='CLOUDPLUS · ДРОН'};document.getElementById('street').onclick=()=>{free();inspection='street';camera.position.set(-15,2.8,-4);controls.target.set(-12,1.8,-14);controls.update();cta.classList.remove('show');chapter.textContent='УЛИЦА · П
